<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Desktop Cats</title>
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    /* Molly: Pixelbild (32 x 28) doppelt so groß am unteren Bildschirmrand */
    #cat {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 64px;
      height: 56px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <img id="cat" src="assets/molly_sitzen.png">
  <script src="renderer.js"></script>
</body>
</html>
