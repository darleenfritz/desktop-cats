<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Desktop Cats</title>
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    /* Beide Katzen: Pixelbilder (32 x 28) doppelt so groß am unteren Bildschirmrand */
    .cat {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 64px;
      height: 56px;
      image-rendering: pixelated;
    }
    /* Die "z z z" über einer schlafenden Katze */
    .zz {
      position: absolute;
      bottom: 44px;
      font-family: Menlo, monospace;
      font-weight: bold;
      font-size: 14px;
      color: #6B6560;
      display: none;
      animation: float 2.4s ease-in-out infinite;
    }
    @keyframes float {
      0%   { transform: translateY(0);     opacity: 0.2; }
      50%  { transform: translateY(-8px);  opacity: 1;   }
      100% { transform: translateY(-16px); opacity: 0;   }
    }
    /* Herzen und "hmpf" beim Streicheln: steigen auf und verblassen */
    .effect {
      position: absolute;
      bottom: 50px;
      font-family: Menlo, monospace;
      font-weight: bold;
      animation: rise 1.2s ease-out forwards;
    }
    .heart {
      color: #E5739B;
      font-size: 18px;
    }
    .grumble {
      color: #6B6560;
      font-size: 13px;
    }
    @keyframes rise {
      0%   { transform: translateY(0);     opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }
  </style>
</head>
<body>
  <img id="malia" class="cat" src="assets/malia_sitzen.png">
  <img id="molly" class="cat" src="assets/molly_sitzen.png">
  <script src="renderer.js"></script>
</body>
</html>
